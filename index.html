<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimalan — IGCSE LT1 Prep (17–24 Aug 2026)</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1e2a3a; --muted:#64748b;
    --accent:#2563eb; --accent-soft:#dbeafe; --green:#16a34a; --green-soft:#dcfce7;
    --red:#dc2626; --red-soft:#fee2e2; --amber:#d97706; --amber-soft:#fef3c7;
    --border:#e2e8f0; --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); line-height:1.55;}
  .wrap{max-width:880px; margin:0 auto; padding:16px;}
  header.top{background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; padding:20px 16px; border-radius:0 0 18px 18px;}
  header.top h1{font-size:1.35rem;}
  header.top p{opacity:.85; font-size:.85rem; margin-top:4px;}
  .tabs{display:flex; gap:6px; overflow-x:auto; padding:14px 0 4px; -webkit-overflow-scrolling:touch;}
  .tab{flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--ink); font-size:.85rem; font-weight:600; cursor:pointer; white-space:nowrap;}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-top:14px;}
  .card h2{font-size:1.05rem; margin-bottom:4px;}
  .sub{color:var(--muted); font-size:.83rem;}
  .pill{display:inline-block; padding:2px 10px; border-radius:999px; font-size:.72rem; font-weight:700; letter-spacing:.02em;}
  .pill.blue{background:var(--accent-soft); color:#1d4ed8;}
  .pill.green{background:var(--green-soft); color:#15803d;}
  .pill.red{background:var(--red-soft); color:#b91c1c;}
  .pill.amber{background:var(--amber-soft); color:#b45309;}
  .btn{display:inline-block; padding:10px 18px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:.9rem; cursor:pointer;}
  .btn.ghost{background:var(--card); color:var(--accent); border:1.5px solid var(--accent);}
  .btn.small{padding:6px 12px; font-size:.8rem;}
  .btn.green{background:var(--green);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .chapter-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .chapter-row:last-child{border-bottom:none;}
  .qcard{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-top:12px;}
  .qhead{display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; align-items:baseline;}
  .qnum{font-weight:800; color:var(--accent);}
  .qmarks{color:var(--muted); font-size:.8rem; white-space:nowrap;}
  .qtext{white-space:pre-wrap; margin-bottom:10px;}
  .opt{display:flex; gap:10px; align-items:flex-start; padding:9px 12px; border:1.5px solid var(--border); border-radius:10px; margin-top:8px; cursor:pointer;}
  .opt input{margin-top:4px;}
  .opt.sel{border-color:var(--accent); background:var(--accent-soft);}
  input[type=text], textarea{width:100%; padding:10px; border:1.5px solid var(--border); border-radius:10px; font:inherit; background:#fbfcfe;}
  textarea{min-height:96px; resize:vertical;}
  .passage{background:#f8fafc; border-left:4px solid var(--accent); padding:12px 14px; border-radius:0 10px 10px 0; margin:10px 0; font-size:.92rem; white-space:pre-wrap;}
  .sticky-bar{position:sticky; bottom:0; background:rgba(244,246,251,.95); backdrop-filter:blur(4px); padding:12px 0; display:flex; gap:10px; align-items:center; justify-content:space-between; border-top:1px solid var(--border); margin-top:16px;}
  .timer{font-weight:800; font-variant-numeric:tabular-nums;}
  .timer.low{color:var(--red);}
  /* results */
  .score-hero{text-align:center; padding:20px;}
  .score-hero .big{font-size:2.4rem; font-weight:800;}
  .bar{height:10px; background:var(--border); border-radius:999px; overflow:hidden; margin:10px auto; max-width:420px;}
  .bar>div{height:100%; background:var(--green); border-radius:999px; transition:width .4s;}
  .r-your{padding:10px 12px; border-radius:10px; margin-top:8px; font-size:.92rem; white-space:pre-wrap;}
  .r-your.ok{background:var(--green-soft);}
  .r-your.bad{background:var(--red-soft);}
  .r-your.self{background:#f1f5f9;}
  .r-key{background:var(--amber-soft); padding:10px 12px; border-radius:10px; margin-top:8px; font-size:.92rem; white-space:pre-wrap;}
  .r-key b{display:block; margin-bottom:4px;}
  .mspoints{margin-top:6px;}
  .mspoint{display:flex; gap:8px; align-items:flex-start; font-size:.88rem; margin-top:4px;}
  .mspoint .dot{flex:0 0 auto; margin-top:2px;}
  .award{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center;}
  .award button{width:38px; height:34px; border-radius:8px; border:1.5px solid var(--border); background:var(--card); font-weight:700; cursor:pointer;}
  .award button.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
  .hist-row{display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:.87rem; flex-wrap:wrap;}
  .muted{color:var(--muted);}
  .notice{background:var(--amber-soft); border-radius:10px; padding:10px 14px; margin-top:12px; font-size:.88rem;}
  @media print{ .tabs,.sticky-bar,.btn,header.top p{display:none;} body{background:#fff;} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>📚 Nimalan — LT1 Prep</h1>
    <p>Grade 9 IGCSE · Vaels International School · Long Test 1: 17–24 Aug 2026</p>
  </div>
</header>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<script>
/* ================= ENGINE ================= */
window.BANK = {};
var SUBJECT_ORDER = ["math","gp","evm","accounts","business","economics","cs","english"];
var state = null; // active test
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function store(key, val){ try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||"null"); localStorage.setItem(key, JSON.stringify(val)); }catch(e){ return null; } }

var activeSubj = null;
function renderTabs(){
  var t = $("tabs"); t.innerHTML = "";
  SUBJECT_ORDER.forEach(function(k){
    if(!BANK[k]) return;
    var b = document.createElement("button");
    b.className = "tab" + (k===activeSubj ? " active":"");
    b.textContent = BANK[k].name;
    b.onclick = function(){ if(state && !confirmLeave()) return; state=null; stopTimer(); activeSubj=k; renderTabs(); renderHome(k); };
    t.appendChild(b);
  });
}
function confirmLeave(){ return confirm("A test is in progress. Leave without submitting?"); }

function renderHome(k){
  var s = BANK[k];
  var h = '<div class="card"><h2>'+esc(s.name)+'</h2><div class="sub">'+esc(s.exam)+'</div></div>';
  h += '<div class="card"><h2>📖 Chapter-wise practice</h2>';
  Object.keys(s.chapters).forEach(function(ch){
    var n = s.chapters[ch].length, m = totalMarks(s.chapters[ch]);
    h += '<div class="chapter-row"><div><b>'+esc(ch)+'</b><div class="sub">'+n+' questions · '+m+' marks</div></div>'+
         '<button class="btn small" onclick="startTest(\''+k+'\',\''+encodeURIComponent(ch)+'\',false)">Start practice</button></div>';
  });
  h += '</div>';
  if(s.mock && s.mock.length){
    h += '<div class="card"><h2>📝 Mock test</h2><div class="sub">'+s.mock.length+' questions · '+totalMarks(s.mock)+' marks · '+s.mockTime+' minutes (timed, like the real paper)</div>'+
         '<div style="margin-top:10px"><button class="btn" onclick="startTest(\''+k+'\',null,true)">Start mock test</button></div></div>';
  }
  var hist = (store("lt1_history")||[]).filter(function(r){ return r.subj===k; });
  if(hist.length){
    h += '<div class="card"><h2>🕑 Previous attempts</h2>';
    hist.slice().reverse().forEach(function(r){
      var pct = Math.round(100*r.score/r.max);
      h += '<div class="hist-row"><span>'+esc(r.test)+' <span class="muted">· '+esc(r.name)+' · '+esc(r.date)+'</span></span><b>'+r.score+'/'+r.max+' ('+pct+'%)</b></div>';
    });
    h += '</div>';
  }
  $("view").innerHTML = h;
  window.scrollTo(0,0);
}

function totalMarks(qs){ return qs.reduce(function(a,q){ return a+(q.marks||1); },0); }

function startTest(k, chEnc, isMock){
  var s = BANK[k];
  var qs, title, time=null;
  if(isMock){ qs = s.mock; title = s.name+" — Mock Test"; time = s.mockTime*60; }
  else { var ch = decodeURIComponent(chEnc); qs = s.chapters[ch]; title = s.name+" — "+ch; }
  state = { subj:k, qs:qs, title:title, time:time, submitted:false, awards:{} };
  renderTest();
  if(time) startTimer(time);
}

var timerInt = null;
function startTimer(secs){
  var end = Date.now() + secs*1000;
  timerInt = setInterval(function(){
    var left = Math.max(0, Math.round((end-Date.now())/1000));
    var el = $("timer");
    if(!el){ stopTimer(); return; }
    var m = Math.floor(left/60), sec = left%60;
    el.textContent = "⏱ " + m + ":" + (sec<10?"0":"") + sec;
    if(left<=300) el.classList.add("low");
    if(left<=0){ stopTimer(); el.textContent = "⏱ Time up!"; }
  }, 500);
}
function stopTimer(){ if(timerInt){ clearInterval(timerInt); timerInt=null; } }

function renderTest(){
  var h = '<div class="card"><h2>'+esc(state.title)+'</h2><div class="sub">'+state.qs.length+' questions · '+totalMarks(state.qs)+' marks · Answer every question, then press Submit.</div>'+
          '<div style="margin-top:10px"><label class="sub" for="stuName">Name: </label><input type="text" id="stuName" style="max-width:220px" value="'+esc(store("lt1_name")||"Nimalan")+'"></div></div>';
  state.qs.forEach(function(q,i){
    h += '<div class="qcard" id="qc'+i+'">';
    h += '<div class="qhead"><span class="qnum">Q'+(i+1)+'</span><span class="qmarks">['+ (q.marks||1) +' mark'+((q.marks||1)>1?'s':'')+'] · '+badgeType(q)+'</span></div>';
    if(q.passage) h += '<div class="passage">'+esc(q.passage)+'</div>';
    h += '<div class="qtext">'+esc(q.q)+'</div>';
    if(q.type==="mcq"){
      q.opts.forEach(function(o,j){
        h += '<label class="opt" id="opt'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="selOpt('+i+','+j+')"><span>'+esc(o)+'</span></label>';
      });
    } else if(q.type==="short" || q.type==="num"){
      h += '<input type="text" id="in'+i+'" placeholder="Type your answer" autocomplete="off">';
    } else {
      h += '<textarea id="in'+i+'" placeholder="Write your answer here — use full sentences and key terms"></textarea>';
    }
    h += '</div>';
  });
  h += '<div class="sticky-bar"><span class="timer" id="timer">'+(state.time?'⏱ …':'Practice mode — no timer')+'</span>'+
       '<button class="btn green" onclick="submitTest()">Submit &amp; mark ✔</button></div>';
  $("view").innerHTML = h;
  window.scrollTo(0,0);
}
function badgeType(q){
  if(q.type==="mcq") return "MCQ — auto-marked";
  if(q.type==="num"||q.type==="short") return "Answer — auto-marked";
  return "Written — marked vs mark scheme";
}
function selOpt(i,j){
  var q = state.qs[i];
  q.opts.forEach(function(_,x){ var el=$("opt"+i+"_"+x); if(el) el.classList.toggle("sel", x===j); });
}

function norm(s){
  return String(s).toLowerCase().replace(/[,₹$]/g,"").replace(/\s+/g," ").trim()
    .replace(/\s*([=+\-×x*\/^()])\s*/g,"$1");
}
function answersMatch(given, accepted){
  var g = norm(given);
  if(!g) return false;
  for(var i=0;i<accepted.length;i++){
    var a = norm(accepted[i]);
    if(g===a) return true;
    var gf = parseFloat(g.replace(/[^0-9.\-]/g,"")), af = parseFloat(a.replace(/[^0-9.\-]/g,""));
    if(!isNaN(gf) && !isNaN(af) && g.replace(/[^0-9.\-]/g,"")!=="" && Math.abs(gf-af)<1e-9 &&
       g.replace(/[0-9.\-]/g,"")===a.replace(/[0-9.\-]/g,"")) return true;
  }
  return false;
}

function submitTest(){
  if(!state || state.submitted) return;
  var unanswered = 0;
  state.qs.forEach(function(q,i){
    if(q.type==="mcq"){
      var sel = document.querySelector('input[name=q'+i+']:checked');
      q._given = sel ? parseInt(sel.value,10) : null;
      if(q._given===null) unanswered++;
    } else {
      var el = $("in"+i);
      q._given = el ? el.value.trim() : "";
      if(!q._given) unanswered++;
    }
  });
  if(unanswered>0 && !confirm(unanswered+" question(s) are unanswered. Submit anyway?")) return;
  var nm = $("stuName") ? $("stuName").value.trim() || "Nimalan" : "Nimalan";
  store("lt1_name", nm);
  state.name = nm;
  stopTimer();
  // mark
  state.qs.forEach(function(q,i){
    var mk = q.marks||1;
    if(q.type==="mcq"){
      q._ok = (q._given===q.ans);
      q._score = q._ok ? mk : 0; q._auto = true;
    } else if(q.type==="short"||q.type==="num"){
      q._ok = answersMatch(q._given, q.ans);
      q._score = q._ok ? mk : 0; q._auto = true;
    } else {
      // structured: keyword-suggested mark, adjustable
      var hits = 0, g = norm(q._given);
      q.points.forEach(function(p){ p._hit = p.kw.some(function(kw){ return g.indexOf(norm(kw))>=0; }); if(p._hit) hits++; });
      q._score = Math.min(mk, hits); q._auto = false;
    }
  });
  state.submitted = true;
  renderResults();
}

function curScore(){ return state.qs.reduce(function(a,q){ return a+(q._score||0); },0); }

function renderResults(){
  var max = totalMarks(state.qs);
  var h = '<div class="card score-hero"><div class="sub">'+esc(state.title)+' · '+esc(state.name)+'</div>'+
          '<div class="big" id="scoreBig"></div><div class="bar"><div id="scoreBar"></div></div>'+
          '<div class="sub" id="scoreMsg"></div>'+
          '<div class="notice">🔒 Correct answers and mark schemes are not shown here — the full answer key has been emailed to the parent. ✍️ Written answers are given a provisional mark from key-point matching; the emailed mark scheme lets a parent adjust the total.</div></div>';
  state.qs.forEach(function(q,i){
    var mk = q.marks||1;
    h += '<div class="qcard">';
    var pill = q._auto ? (q._ok?'<span class="pill green">✔ Correct</span>':'<span class="pill red">✘ Incorrect</span>')
                       : '<span class="pill amber">✍ Provisional mark</span>';
    h += '<div class="qhead"><span class="qnum">Q'+(i+1)+'</span><span>'+pill+' <span class="qmarks" id="qs'+i+'">'+q._score+'/'+mk+'</span></span></div>';
    h += '<div class="qtext">'+esc(q.q)+'</div>';
    var givenTxt = (q.type==="mcq") ? (q._given===null?"(not answered)":q.opts[q._given]) : (q._given||"(not answered)");
    var cls = q._auto ? (q._ok?"ok":"bad") : "self";
    h += '<div class="r-your '+cls+'"><b>'+esc(state.name)+"'s answer:</b> "+esc(givenTxt)+'</div>';
    h += '</div>';
  });
  h += '<div class="card"><h2>📧 Report email</h2><div class="sub">The full report — score, every question, '+esc(state.name)+"'s answers, correct answers and mark schemes — is emailed to the parents on submit.</div>"+
       '<div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center">'+
       '<input type="text" id="emailTo" readonly style="max-width:420px; background:#eef2f7; color:var(--muted)" value="'+REPORT_EMAILS.join(", ")+'">'+
       '<button class="btn small" id="emailBtn" onclick="emailReport()">Resend report</button>'+
       '<span class="sub" id="emailStatus"></span></div></div>';
  h += '<div class="sticky-bar"><button class="btn ghost" onclick="saveAndHome()">💾 Save result &amp; back</button><span></span></div>';
  $("view").innerHTML = h;
  updateScoreHero();
  window.scrollTo(0,0);
  emailReport(); // auto-send full report (with answer key) on submit
}
function buildReport(){
  var max = totalMarks(state.qs), sc = curScore(), pct = max?Math.round(100*sc/max):0;
  var L = [];
  L.push("TEST REPORT — " + state.title);
  L.push("Student: " + state.name);
  L.push("Date: " + new Date().toLocaleString("en-GB"));
  L.push("SCORE: " + sc + " / " + max + "  (" + pct + "%)");
  L.push("");
  state.qs.forEach(function(q,i){
    var mk = q.marks||1;
    L.push("--------------------------------------------------");
    L.push("Q" + (i+1) + " [" + q._score + "/" + mk + " marks]" + (q._auto ? (q._ok ? " — CORRECT" : " — INCORRECT") : " — PROVISIONAL (key-point match; review vs mark scheme below)"));
    L.push("Question: " + q.q.replace(/\s+/g," "));
    if(q.type==="mcq"){
      L.push("Answer given: " + (q._given===null ? "(not answered)" : q.opts[q._given]));
      L.push("Correct answer: " + q.opts[q.ans]);
    } else if(q.type==="short"||q.type==="num"){
      L.push("Answer given: " + (q._given || "(not answered)"));
      L.push("Correct answer: " + q.ans[0]);
    } else {
      L.push("Answer given: " + (q._given || "(not answered)").replace(/\s+/g," "));
      L.push("Mark scheme:");
      q.points.forEach(function(p){ L.push("  " + (p._hit?"[hit] ":"[  -  ] ") + p.pt); });
      if(q.model) L.push("Model answer: " + q.model.replace(/\s+/g," "));
    }
    if(q.why) L.push("Note: " + q.why);
  });
  return L.join("\n");
}
var REPORT_EMAILS = ["gowthaman.selvaraj@gmail.com","sumathithayumavan@gmail.com"];
function emailReport(){
  var st = $("emailStatus"), btn = $("emailBtn");
  btn.disabled = true; st.textContent = "Sending…";
  var max = totalMarks(state.qs);
  var payload = {
    _subject: "LT1 Prep result: " + state.title + " — " + state.name + " scored " + curScore() + "/" + max,
    name: state.name,
    message: buildReport()
  };
  var results = [];
  Promise.all(REPORT_EMAILS.map(function(to){
    return fetch("https://formsubmit.co/ajax/" + encodeURIComponent(to), {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); })
      .then(function(d){ results.push({to:to, ok:!!(d && (d.success===true || d.success==="true")), msg:(d&&d.message)||""}); })
      .catch(function(){ results.push({to:to, ok:false, msg:"no connection"}); });
  })).then(function(){
    btn.disabled = false;
    var fails = results.filter(function(r){ return !r.ok; });
    if(!fails.length) st.textContent = "✅ Sent to both parents. (First time only: each inbox gets a FormSubmit activation email — click Activate once.)";
    else if(fails.length===results.length) st.textContent = "⚠️ Could not send (" + fails[0].msg + "). Check the internet connection and press Resend.";
    else st.textContent = "⚠️ Sent to " + results.filter(function(r){return r.ok}).map(function(r){return r.to}).join(", ") + " but failed for " + fails.map(function(r){return r.to}).join(", ") + " — press Resend.";
  });
}
function award(i,m){
  var q = state.qs[i]; q._score = m;
  var mk = q.marks||1;
  for(var x=0;x<=mk;x++){ var b=$("aw"+i+"_"+x); if(b) b.classList.toggle("sel", x===m); }
  $("qs"+i).textContent = m+"/"+mk;
  updateScoreHero();
}
function updateScoreHero(){
  var max = totalMarks(state.qs), sc = curScore(), pct = max? Math.round(100*sc/max):0;
  $("scoreBig").textContent = sc+" / "+max;
  $("scoreBar").style.width = pct+"%";
  $("scoreBar").style.background = pct>=75?"var(--green)":pct>=50?"var(--amber)":"var(--red)";
  $("scoreMsg").textContent = pct+"% — " + (pct>=85?"Excellent! Exam-ready. 🌟":pct>=70?"Good work — polish the missed points.":pct>=50?"Fair — revise the marked chapters again.":"Needs revision — go through the mark schemes carefully.");
}
function saveAndHome(){
  var max = totalMarks(state.qs);
  var hist = store("lt1_history")||[];
  hist.push({ subj:state.subj, test:state.title.split(" — ").slice(1).join(" — ")||state.title, name:state.name,
              date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),
              score:curScore(), max:max });
  if(hist.length>200) hist = hist.slice(-200);
  store("lt1_history", hist);
  var k = state.subj; state = null;
  renderHome(k);
}

window.addEventListener("load", function(){
  activeSubj = SUBJECT_ORDER.filter(function(k){ return BANK[k]; })[0];
  renderTabs();
  if(activeSubj) renderHome(activeSubj);
});
</script>

<!-- ============ QUESTION BANKS (one script block per subject) ============ -->
<script id="bank-math">BANK.math = {
name:"Mathematics", exam:"IGCSE 0580 · LT1 (Mon 17 Aug FN): Ch 2 Algebra 1, Ch 6 Algebra 2 · 1 hour · 40 marks · board pattern",
mockTime:60,
chapters:{
"Ch 2 — Algebra 1":[
{type:"short",marks:1,q:"Simplify: 4a + 7b − a + 2b",ans:["3a+9b","9b+3a"],why:"Collect like terms: 4a − a = 3a; 7b + 2b = 9b."},
{type:"short",marks:1,q:"Simplify: 5x × 3y",ans:["15xy","15yx"],why:"Multiply the numbers (5 × 3 = 15) and write letters together."},
{type:"short",marks:2,q:"Expand: 3(2x − 5)",ans:["6x-15","6x−15","-15+6x"],why:"Multiply each term inside the bracket by 3: 3×2x = 6x, 3×(−5) = −15."},
{type:"short",marks:2,q:"Expand and simplify: 4(x + 3) + 2(x − 1)",ans:["6x+10","10+6x"],why:"4x + 12 + 2x − 2 = 6x + 10."},

chapters:{

{type:"structured",marks:2,q:"Explain the difference between a personal, national and global perspective, using the issue of plastic waste as an example.",

{type:"mcq",marks:1,q:"Which question is a research question suitable for a Global Perspectives investigation?",opts:["What is the capital of Japan?","Should governments ban fast fashion to protect the environment?","How many litres are in a gallon?","When was the UN founded?"],ans:1,why:"Good GP research questions are debatable, with multiple perspectives — not simple factual lookups."}
],
"Skills — Sources, Evidence & Bias":[
{type:"structured",marks:3,q:"A blogger who is paid by a bottled-water company writes: 'Tap water is unsafe everywhere and everyone should buy bottled water.' Evaluate this source's reliability, making three points.",

{type:"structured",marks:2,q:"Explain the difference between a fact and an opinion, giving one example of each.",

{type:"structured",marks:3,q:"State three questions you should ask to test whether a website is a reliable source of evidence.",

{type:"short",marks:1,q:"Define 'ore'.",ans:["rock containing minerals and metals","a rock containing minerals and metals","rock that contains minerals and metals"],why:"An ore is rock containing minerals and metals (syllabus definition 1.2.1). Accept close wording."},

{type:"structured",marks:2,q:"Define 'renewable resource' and give one example.",

{type:"mcq",marks:1,q:"Which of these is a non-renewable resource?",opts:["Wind","Natural gas","Solar energy","Timber"],ans:1,why:"Fossil fuels (coal, oil, natural gas) take millions of years to form."},
{type:"structured",marks:3,q:"Explain the term 'sustainable development'.",

{type:"structured",marks:4,q:"Describe two impacts of open-cast (surface) mining on the environment and one strategy to restore the land afterwards.",

{type:"short",marks:1,q:"State the term for using resources at a rate at which they can be replaced, so they never run out.",ans:["sustainable use","sustainability","sustainable"],why:"Sustainable use / sustainable resource management."},

{type:"structured",marks:4,q:"A country plans to build a large hydroelectric dam. Explain two benefits and two problems this could create.",

{type:"structured",marks:3,q:"Describe three strategies for the management of energy resources.",

 points:[{pt:"PPC: downward-sloping curve showing maximum combinations of the two goods (1 mark)",kw:["maximum","combinations","boundary","downward","frontier"]},{pt:"(a) Movement along = reallocating resources from one good to the other (1 mark)",kw:["realloc","more of one","less of the other","along"]},{pt:"(a) This involves an opportunity cost (1 mark)",kw:["opportunity cost"]},{pt:"(b) Outward shift = economic growth from more/better resources or technology (1 mark)",kw:["growth","more resources","technology","investment","productivity"]}],
 model:"The PPC slopes down from capital goods (y-axis) to consumer goods (x-axis), showing the maximum combinations producible with existing resources. (a) Moving along the curve means shifting resources — producing more consumer goods means giving up some capital goods (opportunity cost). (b) The curve shifts outward when the quantity or quality of resources rises — e.g. new technology or investment — allowing more of both goods: economic growth."},
{type:"structured",marks:2,q:"Explain the difference between an economic good and a free good, giving one example of each.",
 points:[{pt:"Economic good: scarce, has an opportunity cost (e.g. bread, clothes); free good: unlimited in supply, no opportunity cost (e.g. air, sunshine) (1 mark)",kw:["opportunity cost","scarce","unlimited","limited"]},{pt:"Correct example of each (1 mark)",kw:["air","sunshine","sunlight","seawater","bread","e.g"]}],
 model:"An economic good is scarce relative to wants, so producing or consuming it has an opportunity cost — e.g. bread. A free good is unlimited in supply and has no opportunity cost — e.g. air or sunshine. (Syllabus 1.1.3)"},
{type:"structured",marks:3,q:"State the three basic economic questions that determine how resources are allocated.",
 points:[{pt:"What to produce (1 mark)",kw:["what to produce","what"]},{pt:"How to produce (1 mark)",kw:["how to produce","how"]},{pt:"For whom to produce / who to produce for (1 mark)",kw:["whom","who"]}],
 model:"What to produce, how to produce it, and for whom to produce. (Syllabus 1.1.2)"},
{type:"structured",marks:3,q:"Explain why an economics graduate deciding to do a master's degree faces an opportunity cost, identifying two things given up.",
 points:[{pt:"Concept: next best alternative forgone (1 mark)",kw:["forgone","foregone","given up","next best","alternative"]},{pt:"Earnings from a full-time job given up (1 mark)",kw:["earnings","salary","wage","income","job"]},{pt:"Money spent on fees / leisure time given up (1 mark)",kw:["fees","tuition","cost","leisure","time"]}],
 model:"Choosing the master's means giving up the next best alternative: the salary they would have earned in a full-time job for those years, and the fees paid (plus leisure time) could have been used for other purchases or savings."}

"Unit 2 (Ch 6–8) — Demand, Supply & Price Determination":[
{type:"structured",marks:2,q:"Define 'market equilibrium'.",
 points:[{pt:"The price/point where quantity demanded equals quantity supplied (1 mark)",kw:["demanded equals","demand equals","qd = qs","equal"]},{pt:"No shortage or surplus — the market clears, no tendency for price to change (1 mark)",kw:["shortage","surplus","clears","no tendency","stable"]}],
 model:"Market equilibrium is the price at which quantity demanded equals quantity supplied — the market clears, there is no shortage or surplus, and no pressure for price to change. (Syllabus 2.4)"},
{type:"num",marks:2,q:"At ₹15 per kg, sellers offer 500 kg of tomatoes but buyers want only 300 kg. Calculate the surplus and state what will happen to price.",ans:["200","200 kg","200kg"],why:"Surplus = Qs − Qd = 200 kg. Sellers cut prices to clear stock, so price falls toward equilibrium."},
{type:"structured",marks:2,q:"Define 'demand'.",
 points:[{pt:"Willingness AND ability to buy a product (1 mark)",kw:["willing","ability","able"]},{pt:"At a given price, in a given time period (1 mark)",kw:["price","time period","given"]}],
 model:"Demand is the willingness and ability of consumers to buy a product at each given price over a period of time."},
{type:"mcq",marks:1,q:"The demand curve slopes downward because:",opts:["Producers cut output when prices fall","As price falls, more is demanded","Income always rises over time","Supply increases when price rises"],ans:1,why:"Law of demand: price and quantity demanded are inversely related."},
{type:"structured",marks:2,q:"Distinguish between a movement along the demand curve and a shift of the demand curve.",
 points:[{pt:"Movement along: caused ONLY by a change in the product's own price (extension/contraction) (1 mark)",kw:["own price","price of the product","extension","contraction","along"]},{pt:"Shift: caused by non-price factors (income, tastes, price of substitutes/complements, population…) (1 mark)",kw:["income","taste","substitute","complement","population","non-price","advertis"]}],
 model:"A movement along the curve (extension or contraction) happens only when the good's own price changes. A shift of the whole curve happens when a non-price determinant changes — e.g. income, tastes, advertising, population, or prices of substitutes and complements."},
{type:"structured",marks:4,q:"For each event, state whether the demand curve for coffee shifts right, shifts left, or does not shift:\n(a) The price of tea (a substitute) rises.\n(b) A health report links coffee to illness.\n(c) The price of coffee falls.\n(d) Consumer incomes rise.",
 points:[{pt:"(a) Shifts right (1 mark)",kw:["(a) right","a) right","a right","a - right","a: right"]},{pt:"(b) Shifts left (1 mark)",kw:["(b) left","b) left","b left","b - left","b: left"]},{pt:"(c) No shift — movement along the curve (extension) (1 mark)",kw:["no shift","does not shift","movement","along","extension"]},{pt:"(d) Shifts right (for a normal good) (1 mark)",kw:["(d) right","d) right","d right","d - right","d: right"]}],
 model:"(a) Right — tea is dearer, so buyers switch to coffee. (b) Left — tastes turn against coffee. (c) No shift — a change in coffee's own price causes a movement along the curve. (d) Right — coffee is a normal good, so higher incomes raise demand."},
{type:"structured",marks:2,q:"Define 'supply'.",
 points:[{pt:"Willingness and ability of producers to sell/offer a product (1 mark)",kw:["producers","sell","offer","willing"]},{pt:"At each given price over a time period (1 mark)",kw:["price","time"]}],
 model:"Supply is the willingness and ability of producers to offer a product for sale at each given price over a period of time."},
{type:"structured",marks:3,q:"Explain two factors that could shift the supply curve of wheat to the right.",
 points:[{pt:"Factor 1: good weather/harvest, improved technology, lower input costs (1 mark)",kw:["weather","technology","costs","fertiliser","fertilizer","harvest","machinery"]},{pt:"Factor 2: subsidy from government / more producers / fall in price of alternative crop (1 mark)",kw:["subsid","more producers","alternative crop","tax cut"]},{pt:"Development: at every price, more can/will be offered for sale (1 mark)",kw:["every price","more offered","more supplied","each price"]}],
 model:"Better technology or good weather raises output from the same land, and a government subsidy cuts producers' costs — in both cases farmers can profitably offer more wheat for sale at every price, shifting supply right."},
{type:"mcq",marks:1,q:"A market is best described as:",opts:["A physical building only","Any arrangement bringing buyers and sellers together to trade","A place where only goods (not services) are sold","A government department setting prices"],ans:1,why:"Markets can be physical or online — anywhere buyers and sellers exchange."},
{type:"structured",marks:3,q:"Explain how the price mechanism allocates scarce resources in a market economy.",
 points:[{pt:"Prices act as signals of shortage/surplus (1 mark)",kw:["signal","shortage","surplus","information"]},{pt:"Prices give incentives — higher price attracts producers/resources into a market (1 mark)",kw:["incentive","profit","attract","producers"]},{pt:"Rationing: rising prices ration goods to those willing and able to pay (1 mark)",kw:["ration","willing and able","allocat","who gets"]}],
 model:"When consumers want more of a good, its price rises. The higher price signals the shortage, gives producers an incentive (more profit) to shift resources into making it, and rations the limited supply to buyers most willing and able to pay — so resources follow consumer demand without government direction."},
{type:"num",marks:2,q:"At a price of ₹20, quantity demanded is 100 units and quantity supplied is 60 units. Calculate the size of the shortage.",ans:["40","40 units"],why:"Shortage = Qd − Qs = 100 − 60 = 40 units. Price would be bid upward toward equilibrium."}
]},
mock:[
{type:"structured",marks:2,q:"Define 'scarcity'. [2]",
 points:[{pt:"Resources are limited/finite (1 mark)",kw:["limited","finite","insufficient"]},{pt:"…relative to unlimited wants (1 mark)",kw:["unlimited","wants"]}],
 model:"Scarcity is the situation where finite resources are insufficient to satisfy people's unlimited wants."},
{type:"structured",marks:2,q:"State two characteristics of enterprise as a factor of production. [2]",
 points:[{pt:"Bears risk of the business failing (1 mark)",kw:["risk"]},{pt:"Organises/combines the other factors of production; rewarded with profit (1 mark)",kw:["organis","organiz","combines","decision","profit"]}],
 model:"The entrepreneur bears the risks of production (may lose invested money) and organises the other three factors — land, labour and capital — earning profit as reward."},
{type:"structured",marks:4,q:"A government decides to build a new hospital instead of a new airport on the same site. Explain the opportunity cost of this decision (a) to the government and (b) to a business traveller. [4]",
 points:[{pt:"Definition/idea of next best alternative forgone (1 mark)",kw:["next best","forgone","foregone","given up","alternative"]},{pt:"(a) Government gives up the airport and its benefits (1 mark)",kw:["airport"]},{pt:"(a) Development: e.g. trade, tourism, jobs the airport would bring (1 mark)",kw:["trade","tourism","jobs","revenue","travel"]},{pt:"(b) Traveller gives up shorter journeys/convenience; time lost is a cost (1 mark)",kw:["time","journey","convenien","travel further","longer"]}],
 model:"Opportunity cost is the next best alternative forgone. (a) The government gives up the airport — and the trade, tourism and jobs it might have generated. (b) The business traveller loses the convenience of flying locally and must spend extra time and money travelling to a distant airport."},
{type:"structured",marks:4,q:"Using a production possibility curve diagram (describe it), explain the effect on an economy's PPC of (a) a war destroying factories, and (b) discovery of new oil reserves. [4]",
 points:[{pt:"PPC shows maximum output combinations with given resources (1 mark)",kw:["maximum","combinations","frontier","boundary"]},{pt:"(a) Capital destroyed → fewer resources (1 mark)",kw:["destroy","fewer","less capital","lost"]},{pt:"(a) PPC shifts inward/left (1 mark)",kw:["inward","left","shrink","shifts in"]},{pt:"(b) More natural resources → PPC shifts outward (growth) (1 mark)",kw:["outward","right","growth","expand"]}],
 model:"The PPC shows the maximum combinations of two goods the economy can produce with its resources. (a) War destroys capital, reducing productive capacity — the whole curve shifts inward. (b) New oil reserves add natural resources, shifting the PPC outward: the economy can produce more of both goods."},
{type:"structured",marks:4,q:"Explain, with one example each, the difference between a substitute and a complement, and how a rise in the price of one good affects demand for its substitute and for its complement. [4]",
 points:[{pt:"Substitute: alternative goods, e.g. tea and coffee (1 mark)",kw:["substitute","alternative","tea","coke","pepsi","instead"]},{pt:"Complement: goods used together, e.g. cars and petrol (1 mark)",kw:["complement","together","petrol","printer","ink","bread butter"]},{pt:"Price rise → demand for substitute rises (shifts right) (1 mark)",kw:["substitute rises","switch","right","increase"]},{pt:"Price rise → demand for complement falls (shifts left) (1 mark)",kw:["complement falls","left","decrease","less"]}],
 model:"Substitutes are alternatives (tea/coffee); complements are consumed together (cars/petrol). If coffee's price rises, buyers switch to tea, so demand for tea shifts right. If car prices rise, fewer cars are bought, so demand for petrol shifts left."},
{type:"structured",marks:6,q:"With the aid of a demand and supply diagram (describe it), analyse how the market for umbrellas is affected by an unusually long rainy season. [6]",
 points:[{pt:"Initial equilibrium where demand = supply (1 mark)",kw:["equilibrium","intersect","d=s","demand = supply","clears"]},{pt:"Rain → tastes/needs change: demand for umbrellas rises (1 mark)",kw:["demand rises","demand increases","more demand"]},{pt:"Demand curve shifts right (1 mark)",kw:["right","shifts"]},{pt:"Shortage at the old price (1 mark)",kw:["shortage","excess demand"]},{pt:"Price bid upward; extension of supply (1 mark)",kw:["price rises","bid up","extension","higher price"]},{pt:"New equilibrium: higher price AND higher quantity traded (1 mark)",kw:["new equilibrium","higher quantity","both","price and quantity"]}],
 model:"Initially the market clears where demand meets supply at price P and quantity Q. The long rains increase consumers' need for umbrellas, shifting the demand curve right. At the old price a shortage appears, so sellers raise prices; the higher price causes an extension along the supply curve as producers offer more. The new equilibrium has both a higher price and a larger quantity bought and sold."},
{type:"structured",marks:6,q:"Analyse how the price mechanism would respond, in a market economy, to a permanent fall in the cost of producing solar panels. [6]",
 points:[{pt:"Lower costs → supply increases/shifts right (1 mark)",kw:["supply","right","increase"]},{pt:"Surplus at the original price (1 mark)",kw:["surplus","excess supply"]},{pt:"Price falls to a new equilibrium (1 mark)",kw:["price falls","lower price"]},{pt:"Extension of demand — more consumers willing/able to buy (1 mark)",kw:["extension of demand","more bought","quantity demanded rises","more consumers"]},{pt:"Signals/incentives: resources drawn into solar industry; profits guide reallocation (1 mark)",kw:["signal","incentive","resources","realloc","profit"]},{pt:"Possible knock-on: demand for substitutes (e.g. fossil-fuel energy) falls (1 mark)",kw:["substitute","fossil","electricity","knock-on","related market"]}],
 model:"Cheaper production shifts the supply curve right; at the old price there is a surplus, so price falls. As price falls, demand extends — more households can afford panels — until a new equilibrium at lower price and higher quantity. The rising sales and profits signal producers to move more resources into the solar industry, while demand for substitute energy sources falls, reallocating resources across markets — the price mechanism at work."},
{type:"structured",marks:6,q:"Discuss whether a country benefits from allocating more resources to capital goods rather than consumer goods. [6]",
 points:[{pt:"For: capital goods raise future productive capacity (1 mark)",kw:["future","capacity","growth","productivity"]},{pt:"For: PPC shifts outward — higher living standards later (1 mark)",kw:["ppc","outward","living standards","long run"]},{pt:"Against: fewer consumer goods now — current living standards fall (1 mark)",kw:["fewer consumer","current","today","sacrifice","short run"]},{pt:"Against: opportunity cost hits the poor hardest / benefits take years (1 mark)",kw:["poor","opportunity cost","years","time lag","hardship"]},{pt:"Balance: depends on income level of country, extent of shift, quality of investment (1 mark)",kw:["depends","extent","quality","income level","how many"]},{pt:"Justified conclusion (1 mark)",kw:["conclusion","overall","therefore","on balance","i think","in my view"]}],
 model:"Producing more capital goods (machines, factories, infrastructure) raises future productive capacity, shifting the PPC outward and enabling higher living standards later. But the opportunity cost is fewer consumer goods today, lowering current living standards — a serious sacrifice in a poor country where people lack basics. The judgement depends on how large the shift is, how effective the investment proves, and the country's current income level; a balanced conclusion — e.g. moderate reallocation benefits most countries in the long run — earns the final mark."},
{type:"structured",marks:6,q:"Discuss whether an increase in demand for a product always leads to a higher price. [6]",
 points:[{pt:"Usually yes: demand shifts right → shortage at old price (1 mark)",kw:["shortage","right","excess demand"]},{pt:"Price is bid up to a new equilibrium (1 mark)",kw:["bid up","price rises","new equilibrium","higher price"]},{pt:"However: depends on supply response — if producers can easily expand output, price may rise little (1 mark)",kw:["supply","expand","respond","output","easily"]},{pt:"Time period matters: price rises more in the short run; supply catches up over time (1 mark)",kw:["short run","time","long run","catch"]},{pt:"Supply may shift right simultaneously (new sellers enter), offsetting the price rise (1 mark)",kw:["new sellers","enter","supply shifts","offset","same time"]},{pt:"Justified conclusion (1 mark)",kw:["conclusion","overall","therefore","usually","depends","in most cases"]}],
 model:"Normally an increase in demand shifts the demand curve right, creating a shortage at the old price, and the price is bid up to a new equilibrium. However, the size of the rise depends on how easily supply can respond: if producers can quickly expand output — or new sellers enter, shifting supply right too — the price may rise only slightly, especially over a longer time period. Conclusion: price usually rises, but by how much depends on the supply response and time frame."}

<script id="bank-english">(function(){
var P1 = "The Rooftop Garden\n\nWhen Meera first suggested turning the bare concrete roof of our apartment block into a garden, the residents' association laughed. The roof was a wasteland of cracked cement, rusting water tanks and television cables. Nothing, they said, would ever grow up there.\n\nMeera was not discouraged. She began alone, carrying up sacks of soil on Sunday mornings, her sandals slapping on the stairs. She filled old paint buckets, cracked bathtubs and even a broken suitcase with compost. Within three months, the first tomatoes ripened — small, misshapen, and, according to Meera, the sweetest the building had ever tasted.\n\nSlowly, curiosity defeated doubt. The retired bank manager from the fourth floor appeared one evening with a packet of chilli seeds. Two schoolchildren begged to be allowed to water the plants. By the end of the year, the roof produced spinach, beans, mint and marigolds, and the residents' association — the same one that had laughed — voted to fund a proper drip-irrigation system.\n\nThe garden changed more than the roof. Neighbours who had never exchanged more than a nod now argued cheerfully about the best way to stake beans. The building's electricity bills fell, because the layer of plants kept the top-floor flats noticeably cooler in summer. And every evening, as the sun sank behind the water tanks, a small crowd gathered among the buckets and bathtubs, drinking tea in a place that had once been only for pigeons.";
